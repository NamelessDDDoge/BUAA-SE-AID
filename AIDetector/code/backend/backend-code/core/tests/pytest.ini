[pytest]
DJANGO_SETTINGS_MODULE = backend_settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
# 提示：装了 pytest-django 后建议加 --reuse-db 加速本地跑测试
markers =
    unit: 纯函数 / 小范围逻辑单测
    integration: 走真实 Django ORM / APIClient / 文件系统的集成测试
    e2e: 跨子系统端到端
    slow: 单次 > 2s 的慢测试
    gpu: 需要 CUDA 的测试
    external: 依赖外部服务
    report: 报告生成测试
