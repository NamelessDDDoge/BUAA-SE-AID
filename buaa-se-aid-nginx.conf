server {
    listen 80 default_server;
    server_name 8.141.107.59;
    client_max_body_size 100m;

    root /opt/buaa-se-aid/AIDetector/code/frontend/frontend-user/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /media/ {
        alias /opt/buaa-se-aid/AIDetector/code/backend/backend-code/media/;
    }

    location /static/ {
        alias /opt/buaa-se-aid/AIDetector/code/backend/allstatic/;
    }

    location = /admin-ui {
        return 301 /admin-ui/;
    }

    location /admin-ui/ {
        alias /opt/buaa-se-aid/AIDetector/code/frontend/frontend-admin/dist/;
        try_files $uri $uri/ /admin-ui/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
